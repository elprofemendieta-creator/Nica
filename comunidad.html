<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, onAuthStateChanged } from "firebase/auth";
import { getFirestore, collection, query, orderBy, limit, getDocs, where, addDoc, deleteDoc, doc, onSnapshot, updateDoc, arrayUnion, arrayRemove, getDoc, setDoc } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyA6jVICuE17KJcO34gE1brMxqWEfNd3Fy0",
  authDomain: "mapa-41b00.firebaseapp.com",
  projectId: "mapa-41b00",
  storageBucket: "mapa-41b00.firebasestorage.app",
  messagingSenderId: "535032835400",
  appId: "1:535032835400:web:68c079cbc3f419eafd177d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;
let usuariosCache = new Map();

// ===== TOAST =====
function toast(msg, isError = false) {
  const div = document.createElement("div");
  div.innerText = msg;
  div.style.position = "fixed";
  div.style.bottom = "90px";
  div.style.left = "50%";
  div.style.transform = "translateX(-50%)";
  div.style.background = isError ? "#c62828" : "#2E7D32";
  div.style.padding = "12px 20px";
  div.style.borderRadius = "40px";
  div.style.zIndex = "9999";
  div.style.color = "white";
  div.style.fontWeight = "600";
  div.style.boxShadow = "0 4px 16px rgba(0,0,0,0.15)";
  div.style.maxWidth = "90%";
  div.style.textAlign = "center";
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

// ===== UTILIDADES =====
function escapeHtml(texto) {
  if (!texto) return '';
  const div = document.createElement('div');
  div.textContent = texto;
  return div.innerHTML;
}

function formatearFecha(fecha) {
  if (!fecha) return 'Fecha desconocida';
  try {
    const d = new Date(fecha);
    return d.toLocaleDateString('es-ES', { 
      day: '2-digit', 
      month: 'short', 
      year: 'numeric'
    });
  } catch {
    return 'Fecha inválida';
  }
}

async function getUserData(uid) {
  if (usuariosCache.has(uid)) return usuariosCache.get(uid);
  const userDoc = await getDoc(doc(db, "usuarios", uid));
  if (userDoc.exists()) {
    const data = userDoc.data();
    usuariosCache.set(uid, data);
    return data;
  }
  return null;
}

function getFotoURL(userData) {
  if (userData && userData.fotoURL && userData.fotoURL !== "" && userData.fotoURL !== "null") {
    return userData.fotoURL;
  }
  return "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
}

async function asegurarPerfilUsuario(user) {
  try {
    const userRef = doc(db, "usuarios", user.uid);
    const userDoc = await getDoc(userRef);
    if (!userDoc.exists()) {
      await setDoc(userRef, {
        uid: user.uid,
        nombre: user.displayName || user.email.split('@')[0],
        email: user.email,
        puntos: 0,
        amigos: [],
        solicitudesEnviadas: [],
        solicitudesRecibidas: [],
        fotoURL: user.photoURL || null,
        fechaRegistro: Date.now()
      });
      toast("¡Bienvenido a Guía Pinolero!");
    } else {
      const data = userDoc.data();
      if (data.puntos === undefined) await updateDoc(userRef, { puntos: 0 });
      if (!data.amigos) await updateDoc(userRef, { amigos: [] });
      if (!data.solicitudesEnviadas) await updateDoc(userRef, { solicitudesEnviadas: [] });
      if (!data.solicitudesRecibidas) await updateDoc(userRef, { solicitudesRecibidas: [] });
    }
    return true;
  } catch (error) {
    console.error("Error asegurando perfil:", error);
    return false;
  }
}

// ===== CARGAR PERFIL =====
async function cargarPerfil(user) {
  const nombreMostrar = user.displayName || user.email.split('@')[0];
  document.getElementById("userDisplayName").innerText = nombreMostrar;
  try {
    const userRef = doc(db, "usuarios", user.uid);
    const userDoc = await getDoc(userRef);
    const photo = document.getElementById("userPhoto");
    const defaultAvatar = document.getElementById("defaultAvatar");
    if (userDoc.exists()) {
      const data = userDoc.data();
      document.getElementById("userPoints").innerText = data.puntos || 0;
      const fotoURL = getFotoURL(data);
      photo.src = fotoURL;
      photo.style.display = "block";
      defaultAvatar.style.display = "none";
      photo.onerror = () => {
        photo.style.display = "none";
        defaultAvatar.style.display = "flex";
      };
    } else {
      document.getElementById("userPoints").innerText = "0";
      photo.style.display = "none";
      defaultAvatar.style.display = "flex";
    }
  } catch (error) {
    console.error("Error cargando perfil:", error);
  }
}

// ===== RANKING =====
async function cargarRankingGlobal() {
  try {
    const q = query(collection(db, "usuarios"), orderBy("puntos", "desc"), limit(50));
    const snap = await getDocs(q);
    const body = document.getElementById("rankingBody");
    body.innerHTML = "";
    let pos = 1;
    for (const docSnap of snap.docs) {
      const data = docSnap.data();
      const isCurrentUser = (docSnap.id === currentUser.uid);
      const rowClass = isCurrentUser ? 'highlight-row' : '';
      const puntosMostrar = data.puntos || 0;
      const fotoURL = getFotoURL(data);
      const nombre = data.nombre || "Usuario";
      let medalIcon = '';
      if (pos === 1) medalIcon = '🥇 ';
      else if (pos === 2) medalIcon = '🥈 ';
      else if (pos === 3) medalIcon = '🥉 ';
      body.innerHTML += `
        <tr class="${rowClass}">
          <td><strong>${medalIcon}${pos}</strong></td>
          <td>
            <div class="user-cell">
              <img src="${fotoURL}" class="ranking-avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'" />
              <span>${nombre} ${isCurrentUser ? '<i class="fas fa-user-check" style="color:#F57C00; margin-left:5px;"></i>' : ''}</span>
            </div>
          </td>
          <td><i class="fas fa-star" style="color:#F9A826;"></i> ${puntosMostrar}</td>
        </tr>
      `;
      pos++;
    }
    if (pos === 1) {
      body.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px;">No hay usuarios registrados aún</td></tr>';
    }
    await calcularPosicionGlobal(currentUser.uid);
  } catch (error) {
    console.error("Error cargando ranking:", error);
  }
}

async function calcularPosicionGlobal(uid) {
  try {
    const userDoc = await getDoc(doc(db, "usuarios", uid));
    if (!userDoc.exists()) {
      document.getElementById("positionText").innerHTML = '📝 Completa tu perfil';
      return null;
    }
    const userData = userDoc.data();
    const puntosUsuario = userData.puntos || 0;
    const q = query(collection(db, "usuarios"), orderBy("puntos", "desc"));
    const snap = await getDocs(q);
    let posicion = 0;
    let totalUsuarios = 0;
    let usuariosArray = [];
    snap.forEach((docSnap) => {
      totalUsuarios++;
      const data = docSnap.data();
      usuariosArray.push({
        uid: docSnap.id,
        puntos: data.puntos || 0,
        nombre: data.nombre || "Usuario"
      });
    });
    for (let i = 0; i < usuariosArray.length; i++) {
      if (usuariosArray[i].uid === uid) {
        posicion = i + 1;
        break;
      }
    }
    const positionText = document.getElementById("positionText");
    if (posicion > 0) {
      let medalIcon = '';
      if (posicion === 1) medalIcon = '<i class="fas fa-crown" style="color:#FFD700;"></i> ';
      else if (posicion === 2) medalIcon = '<i class="fas fa-medal" style="color:#C0C0C0;"></i> ';
      else if (posicion === 3) medalIcon = '<i class="fas fa-medal" style="color:#CD7F32;"></i> ';
      positionText.innerHTML = `${medalIcon}Posición #${posicion} de ${totalUsuarios}`;
    } else {
      if (puntosUsuario === 0) {
        positionText.innerHTML = '🌟 0 puntos - ¡Empieza a explorar Nicaragua!';
      } else {
        positionText.innerHTML = `📈 ${puntosUsuario} puntos - Subiendo en el ranking...`;
      }
    }
    return { posicion, puntosUsuario, totalUsuarios };
  } catch (error) {
    console.error("Error calculando posición:", error);
    document.getElementById("positionText").innerHTML = '🔄 Actualizando ranking...';
    return null;
  }
}

// ===== QR =====
function generarQR() {
  const qrDiv = document.getElementById("qrCode");
  qrDiv.innerHTML = "";
  const url = `${window.location.origin}${window.location.pathname}?user=${currentUser.uid}`;
  new QRCode(qrDiv, { text: url, width: 180, height: 180 });
  document.getElementById("copyLinkBtn").onclick = () => {
    navigator.clipboard.writeText(url);
    toast("Enlace copiado");

// ===== AMIGOS =====
async function enviarSolicitud(amigoUid, amigoNombre) {
  if (amigoUid === currentUser.uid) {
    toast("No puedes enviarte solicitud a ti mismo");
    return;
  }
  try {
    const currentUserRef = doc(db, "usuarios", currentUser.uid);
    const currentUserDoc = await getDoc(currentUserRef);
    const currentUserData = currentUserDoc.data();
    const solicitudesEnviadas = currentUserData.solicitudesEnviadas || [];
    if (solicitudesEnviadas.includes(amigoUid)) {
      toast("Ya enviaste solicitud a este usuario");
      return;
    }
    const amigoRef = doc(db, "usuarios", amigoUid);
    const amigosActuales = currentUserData.amigos || [];
    if (amigosActuales.includes(amigoUid)) {
      toast("Ya son amigos");
      return;
    }
    await updateDoc(currentUserRef, { solicitudesEnviadas: arrayUnion(amigoUid) });
    await updateDoc(amigoRef, {
      solicitudesRecibidas: arrayUnion({
        uid: currentUser.uid,
        nombre: currentUser.displayName || currentUser.email.split('@')[0]
      })
    });
    toast(`Solicitud enviada a ${amigoNombre}`);
    cargarAmigos();
  } catch (error) {
    console.error(error);
    toast("Error al enviar solicitud", true);
  }
}

async function aceptarSolicitud(amigoUid, amigoNombre) {
  try {
    const currentUserRef = doc(db, "usuarios", currentUser.uid);
    const currentUserDoc = await getDoc(currentUserRef);
    const currentUserData = currentUserDoc.data();
    const solicitudesRecibidas = currentUserData.solicitudesRecibidas || [];
    const solicitud = solicitudesRecibidas.find(s => s.uid === amigoUid);
    if (!solicitud) {
      toast("Solicitud no encontrada");
      return;
    }
    await updateDoc(currentUserRef, {
      solicitudesRecibidas: arrayRemove(solicitud),
      amigos: arrayUnion(amigoUid)
    });
    const amigoRef = doc(db, "usuarios", amigoUid);
    await updateDoc(amigoRef, {
      solicitudesEnviadas: arrayRemove(currentUser.uid),
      amigos: arrayUnion(currentUser.uid)
    });
    toast(`Ahora son amigos con ${amigoNombre}`);
    cargarAmigos();
  } catch (error) {
    console.error(error);
    toast("Error al aceptar solicitud", true);
  }
}

async function rechazarSolicitud(amigoUid, amigoNombre) {
  try {
    const currentUserRef = doc(db, "usuarios", currentUser.uid);
    const currentUserDoc = await getDoc(currentUserRef);
    const currentUserData = currentUserDoc.data();
    const solicitudesRecibidas = currentUserData.solicitudesRecibidas || [];
    const solicitud = solicitudesRecibidas.find(s => s.uid === amigoUid);
    if (solicitud) {
      await updateDoc(currentUserRef, { solicitudesRecibidas: arrayRemove(solicitud) });
    }
    const amigoRef = doc(db, "usuarios", amigoUid);
    await updateDoc(amigoRef, { solicitudesEnviadas: arrayRemove(currentUser.uid) });
    toast(`Solicitud rechazada`);
    cargarAmigos();
  } catch (error) {
    console.error(error);
    toast("Error al rechazar solicitud", true);
  }
}

async function eliminarAmigo(amigoUid, amigoNombre) {
  if (!confirm(`¿Eliminar a ${amigoNombre} de tus amigos?`)) return;
  try {
    const currentUserRef = doc(db, "usuarios", currentUser.uid);
    const amigoRef = doc(db, "usuarios", amigoUid);
    await updateDoc(currentUserRef, { amigos: arrayRemove(amigoUid) });
    await updateDoc(amigoRef, { amigos: arrayRemove(currentUser.uid) });
    toast(`${amigoNombre} eliminado de tus amigos`);
    cargarAmigos();
  } catch (error) {
    console.error(error);
    toast("Error al eliminar amigo", true);
  }
}

  if (amigosUids.length > 0) {
    amigosDiv.innerHTML = `<h3 style="font-size:1.2rem; margin:15px 0 10px 0;"><i class="fas fa-users"></i> Mis Amigos (${amigosUids.length})</h3>`;

// --- Cargar preguntas ---
async function cargarPreguntas() {
  const lista = document.getElementById('listaPreguntas');
  lista.innerHTML = '<div style="text-align:center; padding:20px; color:#777;"><i class="fas fa-spinner fa-spin"></i> Cargando...</div>';
  
  const categoria = document.getElementById('filtroCategoria').value;
  const busqueda = document.getElementById('buscadorPreguntas').value.toLowerCase().trim();
  
  try {
    const q = query(collection(db, "preguntas"), orderBy("fecha", "desc"));
    const snap = await getDocs(q);
    
    let preguntas = [];
    snap.forEach(doc => {
      const data = doc.data();
      data.id = doc.id;
      preguntas.push(data);
    });
    
    if (categoria) {
      preguntas = preguntas.filter(p => p.categoria === categoria);
    }
    if (busqueda) {
      preguntas = preguntas.filter(p => 
        p.titulo.toLowerCase().includes(busqueda) || 
        p.contenido.toLowerCase().includes(busqueda)
      );
    }
    
    if (preguntas.length === 0) {
      lista.innerHTML = `
        <div class="foro-vacio">
          <i class="fas fa-comment-slash"></i>
          No hay preguntas con esos filtros.<br>
          <span style="font-size:0.9rem;">¡Sé el primero en preguntar!</span>
        </div>
      `;
      return;
    }
    
    lista.innerHTML = preguntas.map(p => `
      <div class="pregunta-card" onclick="verDetallePregunta('${p.id}')">
        <h4>${escapeHtml(p.titulo)}</h4>
        <div class="preview">${escapeHtml(p.contenido.substring(0, 100))}${p.contenido.length > 100 ? '...' : ''}</div>
        <div class="meta-foro">
          <span>👤 ${escapeHtml(p.autor || 'Anónimo')}</span>
          <span>💬 ${p.respuestas || 0}</span>
          <span>👍 ${p.votos || 0}</span>
          <span class="categoria-tag">${escapeHtml(p.categoria || 'General')}</span>
          <span>${formatearFecha(p.fecha)}</span>
        </div>
      </div>
    `).join('');
    
  } catch (error) {
    console.error("Error cargando preguntas:", error);
    lista.innerHTML = `<div style="text-align:center; padding:20px; color:#c0392b;">❌ Error al cargar</div>`;
  }
}

              ${r.mejorRespuesta ? '⭐ <span style="color:#F9A826;font-size:0.75rem;">Mejor respuesta</span>' : ''}
            </div>
            <div style="margin:4px 0; font-size:0.95rem;">${escapeHtml(r.contenido)}</div>
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
              <span class="fecha-respuesta">${formatearFecha(r.fecha)}</span>
              <div>
                <span>👍 ${r.votos || 0}</span>
                <button class="btn-votar" onclick="votarRespuesta('${pregunta.id}','${r.id}')">Votar</button>
                ${esAutor && !r.mejorRespuesta ? `<button class="btn-votar" onclick="marcarMejorRespuesta('${pregunta.id}','${r.id}')" style="color:#F9A826;">⭐ Marcar</button>` : ''}
              </div>
            </div>

      <div class="respuesta-input-area">

        <textarea id="nuevaRespuesta" rows="3" placeholder="Escribe tu respuesta..."></textarea>

async function publicarRespuesta(preguntaId) {
  const contenido = document.getElementById('nuevaRespuesta').value.trim();
  const autor = document.getElementById('autorRespuesta').value.trim() || 'Viajero Anónimo';
  
  if (!contenido) {
    toast('✍️ Escribe tu respuesta.', true);
    return;
  }
  
  try {
    await addDoc(collection(db, "preguntas", preguntaId, "respuestas"), {
      autor: autor,
      contenido: contenido,
      fecha: Date.now(),
      votos: 0,
      mejorRespuesta: false
    });
    
    const ref = doc(db, "preguntas", preguntaId);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const data = snap.data();
      await updateDoc(ref, { respuestas: (data.respuestas || 0) + 1 });
    }
    
    document.getElementById('nuevaRespuesta').value = '';
    document.getElementById('autorRespuesta').value = '';
    toast('✅ Respuesta enviada');
    verDetallePregunta(preguntaId);

    console.error(error);
    toast('❌ Error: ' + error.message, true);
  }
}

async function marcarMejorRespuesta(preguntaId, respuestaId) {
  try {
    const respRef = collection(db, "preguntas", preguntaId, "respuestas");
    const snap = await getDocs(respRef);
    for (const doc of snap.docs) {
      if (doc.data().mejorRespuesta) {
        await updateDoc(doc.ref, { mejorRespuesta: false });
      }
    }
    await updateDoc(doc(db, "preguntas", preguntaId, "respuestas", respuestaId), { 
      mejorRespuesta: true 
    });
    toast('⭐ Mejor respuesta marcada');
    verDetallePregunta(preguntaId);
  } catch (error) {
    toast('❌ Error', true);
  }
}

    const snap = await getDocs(respRef);
    for (const doc of snap.docs) {

    toast('🗑️ Pregunta eliminada');

  } catch (error) {
    toast('❌ Error al eliminar', true);
  }
}

// ===== NAVEGACIÓN POR PESTAÑAS =====
function switchTab(tabId, element) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  element.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchSubTab(subTabType) {
  const rankingBox = document.getElementById('subtab-ranking');
  const amigosBox = document.getElementById('subtab-amigos');
  const chips = document.querySelectorAll('.chip');
  if (subTabType === 'ranking') {
    rankingBox.style.display = 'block';
    amigosBox.style.display = 'none';
    chips[0].classList.add('active');
    chips[1].classList.remove('active');
  } else {
    rankingBox.style.display = 'none';
    amigosBox.style.display = 'block';
    chips[0].classList.remove('active');
    chips[1].classList.add('active');
  }
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', function() {
    switchTab(this.dataset.tab, this);
  });
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', function() {
    switchSubTab(this.dataset.subtab);
  });
});

// ===== AUTENTICACIÓN =====
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }
  currentUser = user;
  await asegurarPerfilUsuario(user);
  await cargarPerfil(user);
  generarQR();
  await cargarRankingGlobal();
  cargarAmigos();
  escucharCambiosPuntos();
  onSnapshot(doc(db, "usuarios", user.uid), () => {
    cargarAmigos();
  });
  
  // Cargar preguntas del foro
  cargarPreguntas();
});

</script>
