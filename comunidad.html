// ===== SISTEMA DE ESTADO ONLINE/OFFLINE SIN FIREBASE =====
class StatusManager {
  constructor() {
    this.statusKey = 'user_status';
    this.heartbeatInterval = null;
    this.heartbeatTime = 30000; // 30 segundos
    this.offlineTimeout = 60000; // 1 minuto sin heartbeat = offline
    this.isOnline = false;
    this.listeners = [];
  }

  // Iniciar el sistema
  start(userId) {
    // Limpiar intervalos anteriores
    this.stop();
    
    // Marcar como online
    this.setStatus('online', userId);
    
    // Escuchar eventos de visibilidad
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        this.setStatus('online', userId);
      } else {
        this.setStatus('away', userId);
      }
    });

    // Escuchar eventos de conexión de red
    window.addEventListener('online', () => {
      this.setStatus('online', userId);
    });

    window.addEventListener('offline', () => {
      this.setStatus('offline', userId);
    });

    // Heartbeat periódico
    this.heartbeatInterval = setInterval(() => {
      if (navigator.onLine && document.visibilityState === 'visible') {
        this.setStatus('online', userId);
      }
    }, this.heartbeatTime);

    // Monitorear estado de otros usuarios
    this.monitorOtherUsers();

    // Actualizar el indicador principal
    this.updateUI();
  }

  stop() {
    if (this.heartbeatInterval) {
      clearInterval(this.heartbeatInterval);
      this.heartbeatInterval = null;
    }
  }

  setStatus(status, userId) {
    const statusData = {
      state: status,
      userId: userId,
      timestamp: Date.now(),
      lastSeen: new Date().toISOString()
    };

    // Guardar en localStorage
    try {
      localStorage.setItem(this.statusKey, JSON.stringify(statusData));
    } catch (e) {
      console.warn('No se pudo guardar en localStorage');
    }

    // Guardar en sessionStorage para compartir entre pestañas
    try {
      sessionStorage.setItem(this.statusKey, JSON.stringify(statusData));
    } catch (e) {}

    this.isOnline = status === 'online';
    this.updateUI();
    this.notifyListeners(statusData);
  }

  getStatus() {
    try {
      const data = localStorage.getItem(this.statusKey);
      if (data) {
        const parsed = JSON.parse(data);
        // Verificar si el estado sigue siendo válido
        const age = Date.now() - parsed.timestamp;
        if (age < this.offlineTimeout) {
          return parsed;
        } else {
          return { state: 'offline', ...parsed };
        }
      }
    } catch (e) {}
    return { state: 'offline', userId: null };
  }

  // Monitorear otros usuarios (simulado)
  monitorOtherUsers() {
    // En una app real, aquí se consultaría una API
    // Por ahora, simulamos algunos usuarios
    setInterval(() => {
      this.updateOtherUsers();
    }, 10000);
  }

  updateOtherUsers() {
    // Simular actualización de otros usuarios
    // En la vida real, esto vendría de una API o WebSocket
    const users = document.querySelectorAll('.friend-item, .ranking-avatar');
    users.forEach((user, index) => {
      // Simular estado aleatorio (75% online, 25% offline)
      const isOnline = Math.random() > 0.25;
      const statusDot = user.closest('.friend-item')?.querySelector('.status-dot') || 
                       user.closest('.user-cell')?.querySelector('.status-dot');
      if (statusDot) {
        statusDot.classList.remove('status-online', 'status-offline');
        statusDot.classList.add(isOnline ? 'status-online' : 'status-offline');
      }
    });
  }

  updateUI() {
    const dot = document.getElementById('userMainStatusDot');
    if (!dot) return;

    const status = this.getStatus();
    dot.classList.remove('status-online', 'status-offline', 'status-away');
    
    if (status.state === 'online') {
      dot.classList.add('status-online');
    } else if (status.state === 'away') {
      dot.classList.add('status-offline');
      dot.style.opacity = '0.5';
    } else {
      dot.classList.add('status-offline');
      dot.style.opacity = '1';
    }

    // Actualizar badge de estado en el perfil
    const statusText = document.getElementById('statusText');
    if (statusText) {
      const statusMap = {
        'online': '🟢 En línea',
        'away': '🟡 Ausente',
        'offline': '⚪ Desconectado'
      };
      statusText.textContent = statusMap[status.state] || statusMap.offline;
    }
  }

  // Sistema de notificaciones para cambios de estado
  addListener(callback) {
    this.listeners.push(callback);
  }

  notifyListeners(status) {
    this.listeners.forEach(callback => callback(status));
  }

  // Simular usuario en línea
  isUserOnline(userId) {
    // En una app real, esto consultaría el estado real del usuario
    // Por ahora, simulamos que todos están online
    return true;
  }
}

// Crear instancia del gestor de estado
const statusManager = new StatusManager();

// ===== TOAST =====
function toast(msg, isError = false) {
  const div = document.createElement("div");
  div.innerText = msg;
  div.style.position = "fixed";
  div.style.bottom = "90px";
  div.style.left = "50%";
  div.style.transform = "translateX(-50%)";
  div.style.background = isError ? "#c62828" : "#2E7D32";
  div.style.padding = "12px 20px";
  div.style.borderRadius = "40px";
  div.style.zIndex = "9999";
  div.style.color = "white";
  div.style.fontWeight = "600";
  div.style.boxShadow = "0 4px 16px rgba(0,0,0,0.15)";
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

// ===== UTILIDADES =====
async function getUserData(uid) {
  if (usuariosCache.has(uid)) return usuariosCache.get(uid);
  const userDoc = await getDoc(doc(db, "usuarios", uid));
  if (userDoc.exists()) {
    const data = userDoc.data();
    usuariosCache.set(uid, data);
    return data;
  }
  return null;
}

function getFotoURL(userData) {
  if (userData && userData.fotoURL && userData.fotoURL !== "" && userData.fotoURL !== "null") {
    return userData.fotoURL;
  }
  return "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
}

async function asegurarPerfilUsuario(user) {
  try {
    const userRef = doc(db, "usuarios", user.uid);
    const userDoc = await getDoc(userRef);
    if (!userDoc.exists()) {
      await setDoc(userRef, {
        uid: user.uid,
        nombre: user.displayName || user.email.split('@')[0],
        email: user.email,
        puntos: 0,
        amigos: [],
        solicitudesEnviadas: [],
        solicitudesRecibidas: [],
        fotoURL: user.photoURL || null,
        fechaRegistro: Date.now()
      });
      toast("¡Bienvenido a Guía Pinolero!");
    } else {
      const data = userDoc.data();
      if (data.puntos === undefined) await updateDoc(userRef, { puntos: 0 });
      if (!data.amigos) await updateDoc(userRef, { amigos: [] });
      if (!data.solicitudesEnviadas) await updateDoc(userRef, { solicitudesEnviadas: [] });
      if (!data.solicitudesRecibidas) await updateDoc(userRef, { solicitudesRecibidas: [] });
    }
    return true;
  } catch (error) {
    console.error("Error asegurando perfil:", error);
    return false;
  }
}

// ===== CARGAR PERFIL =====
async function cargarPerfil(user) {
  const nombreMostrar = user.displayName || user.email.split('@')[0];
  document.getElementById("userDisplayName").innerText = nombreMostrar;
  
  try {
    const userRef = doc(db, "usuarios", user.uid);
    const userDoc = await getDoc(userRef);
    const photo = document.getElementById("userPhoto");
    const defaultAvatar = document.getElementById("defaultAvatar");
    if (userDoc.exists()) {
      const data = userDoc.data();
      document.getElementById("userPoints").innerText = data.puntos || 0;
      const fotoURL = getFotoURL(data);
      photo.src = fotoURL;
      photo.style.display = "block";
      defaultAvatar.style.display = "none";
      photo.onerror = () => {
        photo.style.display = "none";
        defaultAvatar.style.display = "flex";
      };
    } else {
      document.getElementById("userPoints").innerText = "0";
      photo.style.display = "none";
      defaultAvatar.style.display = "flex";
    }
  } catch (error) {
    console.error("Error cargando perfil:", error);
  }
}

// ===== RANKING =====
async function cargarRankingGlobal() {
  try {
    const q = query(collection(db, "usuarios"), orderBy("puntos", "desc"), limit(50));
    const snap = await getDocs(q);
    const body = document.getElementById("rankingBody");
    body.innerHTML = "";
    let pos = 1;
    for (const docSnap of snap.docs) {
      const data = docSnap.data();
      const isCurrentUser = (docSnap.id === currentUser.uid);
      const rowClass = isCurrentUser ? 'highlight-row' : '';
      const puntosMostrar = data.puntos || 0;
      const fotoURL = getFotoURL(data);
      const nombre = data.nombre || "Usuario";
      let medalIcon = '';
      if (pos === 1) medalIcon = '🥇 ';
      else if (pos === 2) medalIcon = '🥈 ';
      else if (pos === 3) medalIcon = '🥉 ';

      // Simular estado online/offline
      const isOnline = statusManager.isUserOnline(docSnap.id);
      const statusClass = isOnline ? 'status-online' : 'status-offline';

      body.innerHTML += `
        <tr class="${rowClass}">
          <td><strong>${medalIcon}${pos}</strong></td>
          <td>
            <div class="user-cell">
              <div class="avatar-wrapper">
                <img src="${fotoURL}" class="ranking-avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'" />
                <span class="status-dot ${statusClass}"></span>
              </div>
              <span>${nombre} ${isCurrentUser ? '<i class="fas fa-user-check" style="color:#F57C00; margin-left:5px;"></i>' : ''}</span>
            </div>
          </td>
          <td><i class="fas fa-star" style="color:#F9A826;"></i> ${puntosMostrar}</td>
        </tr>
      `;
      pos++;
    }
    if (pos === 1) {
      body.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px;">No hay usuarios registrados aún</td></tr>';
    }
    await calcularPosicionGlobal(currentUser.uid);
  } catch (error) {
    console.error("Error cargando ranking:", error);
  }
}

async function calcularPosicionGlobal(uid) {
  try {
    const userDoc = await getDoc(doc(db, "usuarios", uid));
    if (!userDoc.exists()) {
      document.getElementById("positionText").innerHTML = '📝 Completa tu perfil';
      return null;
    }
    const userData = userDoc.data();
    const puntosUsuario = userData.puntos || 0;
    const q = query(collection(db, "usuarios"), orderBy("puntos", "desc"));
    const snap = await getDocs(q);
    let posicion = 0;
    let totalUsuarios = 0;
    let usuariosArray = [];
    snap.forEach((docSnap) => {
      totalUsuarios++;
      const data = docSnap.data();
      usuariosArray.push({
        uid: docSnap.id,
        puntos: data.puntos || 0,
        nombre: data.nombre || "Usuario"
      });
    });
    for (let i = 0; i < usuariosArray.length; i++) {
      if (usuariosArray[i].uid === uid) {
        posicion = i + 1;
        break;
      }
    }
    const positionText = document.getElementById("positionText");
    if (posicion > 0) {
      let medalIcon = '';
      if (posicion === 1) medalIcon = '<i class="fas fa-crown" style="color:#FFD700;"></i> ';
      else if (posicion === 2) medalIcon = '<i class="fas fa-medal" style="color:#C0C0C0;"></i> ';
      else if (posicion === 3) medalIcon = '<i class="fas fa-medal" style="color:#CD7F32;"></i> ';
      positionText.innerHTML = `${medalIcon}Posición #${posicion} de ${totalUsuarios}`;
    } else {
      if (puntosUsuario === 0) {
        positionText.innerHTML = '🌟 0 puntos - ¡Empieza a explorar Nicaragua!';
      } else {
        positionText.innerHTML = `📈 ${puntosUsuario} puntos - Subiendo en el ranking...`;
      }
    }
    return { posicion, puntosUsuario, totalUsuarios };
  } catch (error) {
    console.error("Error calculando posición:", error);
    document.getElementById("positionText").innerHTML = '🔄 Actualizando ranking...';
    return null;
  }
}

// ===== QR =====
function generarQR() {
  const qrDiv = document.getElementById("qrCode");
  qrDiv.innerHTML = "";
  const url = `${window.location.origin}${window.location.pathname}?user=${currentUser.uid}`;
  new QRCode(qrDiv, { text: url, width: 180, height: 180 });
  document.getElementById("copyLinkBtn").onclick = () => {
    navigator.clipboard.writeText(url);
    toast("Enlace copiado");

  document.getElementById("shareWhatsAppBtn").onclick = () => {
    window.open(`https://wa.me/?text=${encodeURIComponent(url)}`, "_blank");
  };
}

// ===== AMIGOS =====
async function enviarSolicitud(amigoUid, amigoNombre) {
  if (amigoUid === currentUser.uid) {
    toast("No puedes enviarte solicitud a ti mismo");
    return;
  }
  try {
    const currentUserRef = doc(db, "usuarios", currentUser.uid);
    const currentUserDoc = await getDoc(currentUserRef);
    const currentUserData = currentUserDoc.data();
    const solicitudesEnviadas = currentUserData.solicitudesEnviadas || [];
    if (solicitudesEnviadas.includes(amigoUid)) {
      toast("Ya enviaste solicitud a este usuario");
      return;
    }
    const amigoRef = doc(db, "usuarios", amigoUid);
    const amigosActuales = currentUserData.amigos || [];
    if (amigosActuales.includes(amigoUid)) {
      toast("Ya son amigos");
      return;
    }
    await updateDoc(currentUserRef, { solicitudesEnviadas: arrayUnion(amigoUid) });
    await updateDoc(amigoRef, {
      solicitudesRecibidas: arrayUnion({
        uid: currentUser.uid,
        nombre: currentUser.displayName || currentUser.email.split('@')[0]
      })
    });
    toast(`Solicitud enviada a ${amigoNombre}`);
    cargarAmigos();
  } catch (error) {
    console.error(error);
    toast("Error al enviar solicitud", true);
  }
}

async function aceptarSolicitud(amigoUid, amigoNombre) {
  try {
    const currentUserRef = doc(db, "usuarios", currentUser.uid);
    const currentUserDoc = await getDoc(currentUserRef);
    const currentUserData = currentUserDoc.data();
    const solicitudesRecibidas = currentUserData.solicitudesRecibidas || [];
    const solicitud = solicitudesRecibidas.find(s => s.uid === amigoUid);
    if (!solicitud) {
      toast("Solicitud no encontrada");
      return;
    }
    await updateDoc(currentUserRef, {
      solicitudesRecibidas: arrayRemove(solicitud),
      amigos: arrayUnion(amigoUid)
    });
    const amigoRef = doc(db, "usuarios", amigoUid);
    await updateDoc(amigoRef, {
      solicitudesEnviadas: arrayRemove(currentUser.uid),
      amigos: arrayUnion(currentUser.uid)
    });
    toast(`Ahora son amigos con ${amigoNombre}`);
    cargarAmigos();
  } catch (error) {
    console.error(error);
    toast("Error al aceptar solicitud", true);
  }
}

async function rechazarSolicitud(amigoUid, amigoNombre) {
  try {
    const currentUserRef = doc(db, "usuarios", currentUser.uid);
    const currentUserDoc = await getDoc(currentUserRef);
    const currentUserData = currentUserDoc.data();
    const solicitudesRecibidas = currentUserData.solicitudesRecibidas || [];
    const solicitud = solicitudesRecibidas.find(s => s.uid === amigoUid);
    if (solicitud) {
      await updateDoc(currentUserRef, { solicitudesRecibidas: arrayRemove(solicitud) });
    }
    const amigoRef = doc(db, "usuarios", amigoUid);
    await updateDoc(amigoRef, { solicitudesEnviadas: arrayRemove(currentUser.uid) });
    toast(`Solicitud rechazada`);
    cargarAmigos();
  } catch (error) {
    console.error(error);
    toast("Error al rechazar solicitud", true);
  }
}

async function eliminarAmigo(amigoUid, amigoNombre) {
  if (!confirm(`¿Eliminar a ${amigoNombre} de tus amigos?`)) return;
  try {
    const currentUserRef = doc(db, "usuarios", currentUser.uid);
    const amigoRef = doc(db, "usuarios", amigoUid);
    await updateDoc(currentUserRef, { amigos: arrayRemove(amigoUid) });
    await updateDoc(amigoRef, { amigos: arrayRemove(currentUser.uid) });
    toast(`${amigoNombre} eliminado de tus amigos`);
    cargarAmigos();
  } catch (error) {
    console.error(error);
    toast("Error al eliminar amigo", true);
  }
}

async function cargarAmigos() {
  const userDoc = await getDoc(doc(db, "usuarios", currentUser.uid));
  if (!userDoc.exists()) return;
  const userData = userDoc.data();
  const amigosUids = userData.amigos || [];
  const solicitudesRecibidas = userData.solicitudesRecibidas || [];
  const solicitudesDiv = document.getElementById("solicitudesPendientes");
  
  if (solicitudesRecibidas.length > 0) {
    solicitudesDiv.innerHTML = `<h3 style="font-size:1.2rem; margin:15px 0 10px 0;"><i class="fas fa-user-plus"></i> Solicitudes Pendientes <span class="badge">${solicitudesRecibidas.length}</span></h3>`;
    for (const solicitud of solicitudesRecibidas) {
      const amigoData = await getUserData(solicitud.uid);
      const nombre = amigoData?.nombre || solicitud.nombre || "Usuario";
      const fotoURL = getFotoURL(amigoData);
      const isOnline = statusManager.isUserOnline(solicitud.uid);
      const statusClass = isOnline ? 'status-online' : 'status-offline';

      solicitudesDiv.innerHTML += `
        <div class="friend-item request-item">
          <div class="friend-info">
            <div class="avatar-wrapper">
              <img src="${fotoURL}" class="friend-avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'" />
              <span class="status-dot ${statusClass}"></span>
            </div>
            <div class="friend-details"><strong>${nombre}</strong></div>
          </div>
          <div class="friend-actions">
            <button class="btn btn-success" onclick="window.aceptarSolicitudModule('${solicitud.uid}', '${nombre.replace(/'/g, "\\'")}')">
              <i class="fas fa-check"></i> Aceptar
            </button>
            <button class="btn btn-danger" onclick="window.rechazarSolicitudModule('${solicitud.uid}', '${nombre.replace(/'/g, "\\'")}')">
              <i class="fas fa-times"></i> Rechazar
            </button>
          </div>
        </div>
      `;
    }
  } else {
    solicitudesDiv.innerHTML = "";
  }
  
  const amigosDiv = document.getElementById("amigosList");
  if (amigosUids.length > 0) {
    amigosDiv.innerHTML = `<h3 style="font-size:1.2rem; margin:15px 0 10px 0;"><i class="fas fa-users"></i> Mis Amigos (${amigosUids.length})</h3>`;
    for (const amigoUid of amigosUids) {
      const amigoData = await getUserData(amigoUid);
      const nombre = amigoData?.nombre || "Usuario";
      const puntos = amigoData?.puntos || 0;
      const fotoURL = getFotoURL(amigoData);
      const isOnline = statusManager.isUserOnline(amigoUid);
      const statusClass = isOnline ? 'status-online' : 'status-offline';

      amigosDiv.innerHTML += `
        <div class="friend-item">
          <div class="friend-info">
            <div class="avatar-wrapper">
              <img src="${fotoURL}" class="friend-avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'" />
              <span class="status-dot ${statusClass}"></span>
            </div>
            <div class="friend-details">
              <strong>${nombre}</strong>
              <small class="friend-points"><i class="fas fa-star"></i> ${puntos} puntos</small>
            </div>
          </div>
          <div class="friend-actions">
            <button class="btn btn-danger" onclick="window.eliminarAmigoModule('${amigoUid}', '${nombre.replace(/'/g, "\\'")}')">
              <i class="fas fa-user-minus"></i> Eliminar
            </button>
          </div>
        </div>
      `;
    }
  } else {
    amigosDiv.innerHTML = `<div class="empty-state"><i class="fas fa-user-friends"></i><p>No tienes amigos agregados</p><small>Busca usuarios para enviar solicitudes</small></div>`;
  }
}

// ===== BUSCADOR =====
const searchBtn = document.getElementById("searchUserBtn");
const searchInput = document.getElementById("searchUserInput");
const searchResults = document.getElementById("searchResults");

searchBtn.addEventListener("click", async () => {
  const texto = searchInput.value.trim().toLowerCase();
  if (!texto) {
    toast("Escribe un nombre para buscar");
    return;
  }
  searchResults.innerHTML = '<p><i class="fas fa-spinner fa-spin"></i> Buscando...</p>';
  try {
    const snap = await getDocs(collection(db, "usuarios"));
    searchResults.innerHTML = "";
    let encontrados = 0;
    const currentUserData = await getDoc(doc(db, "usuarios", currentUser.uid));
    const currentAmigos = currentUserData.data()?.amigos || [];
    const currentSolicitudesEnviadas = currentUserData.data()?.solicitudesEnviadas || [];
    for (const docSnap of snap.docs) {
      const data = docSnap.data();
      if (data.uid === currentUser.uid) continue;
      const nombre = (data.nombre || "").toLowerCase();
      if (nombre.includes(texto)) {
        encontrados++;
        const esAmigo = currentAmigos.includes(data.uid);
        const solicitudEnviada = currentSolicitudesEnviadas.includes(data.uid);
        const fotoURL = getFotoURL(data);
        const isOnline = statusManager.isUserOnline(data.uid);
        const statusClass = isOnline ? 'status-online' : 'status-offline';

        let boton = '';
        if (esAmigo) {
          boton = '<button class="btn btn-danger" disabled style="opacity:0.5;"><i class="fas fa-check"></i> Amigos</button>';
        } else if (solicitudEnviada) {
          boton = '<button class="btn btn-outline" disabled style="opacity:0.5;"><i class="fas fa-clock"></i> Solicitud enviada</button>';
        } else {
          boton = `<button class="btn" onclick="window.enviarSolicitudModule('${data.uid}', '${(data.nombre || "Usuario").replace(/'/g, "\\'")}')"><i class="fas fa-user-plus"></i> Enviar solicitud</button>`;
        }
        searchResults.innerHTML += `
          <div class="friend-item">
            <div class="friend-info">
              <div class="avatar-wrapper">
                <img src="${fotoURL}" class="friend-avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'" />
                <span class="status-dot ${statusClass}"></span>
              </div>
              <div class="friend-details">
                <strong>${data.nombre || "Usuario"}</strong>
                <small class="friend-points"><i class="fas fa-star"></i> ${data.puntos || 0} puntos</small>
              </div>
            </div>
            <div class="friend-actions">${boton}</div>
          </div>
        `;
      }
    }
    if (encontrados === 0) {
      searchResults.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>No se encontraron usuarios</p></div>';
    }
  } catch (error) {
    console.error(error);
    toast("Error al buscar usuarios", true);
  }
});

// ===== FORO =====
const foroMensajes = document.getElementById("foroMensajes");
const publicarForoBtn = document.getElementById("publicarForoBtn");
publicarForoBtn.addEventListener("click", async () => {
  const input = document.getElementById("mensajeForo");
  const mensaje = input.value.trim();
  if (!mensaje) {
    toast("Escribe un mensaje");
    return;
  }
  try {
    await addDoc(collection(db, "foro"), {
      uid: currentUser.uid,
      nombre: currentUser.displayName || currentUser.email.split('@')[0],
      mensaje: mensaje,
      fecha: Date.now()
    });
    input.value = "";
    toast("Mensaje publicado");
  } catch (error) {
    console.error(error);
    toast("Error al publicar", true);
  }
});

const qForo = query(collection(db, "foro"), orderBy("fecha", "desc"));
onSnapshot(qForo, (snapshot) => {
  foroMensajes.innerHTML = "";
  snapshot.forEach((docSnap) => {
    const data = docSnap.data();
    const post = document.createElement("div");
    post.className = "foro-post";
    const fecha = new Date(data.fecha).toLocaleString();
    post.innerHTML = `<strong>${data.nombre}</strong><p>${data.mensaje}</p><small>${fecha}</small>`;
    if (data.uid === currentUser.uid) {
      const btn = document.createElement("button");
      btn.className = "btn delete-post-btn";
      btn.innerHTML = '<i class="fas fa-trash"></i> Eliminar';
      btn.onclick = async () => {
        if (confirm("¿Eliminar mensaje?")) {
          await deleteDoc(doc(db, "foro", docSnap.id));
          toast("Mensaje eliminado");
        }
      };
      post.appendChild(btn);
    }
    foroMensajes.appendChild(post);
  });
});

// ===== ESCUCHAR PUNTOS =====
function escucharCambiosPuntos() {
  const userRef = doc(db, "usuarios", currentUser.uid);
  onSnapshot(userRef, async (docSnap) => {
    if (docSnap.exists()) {
      const data = docSnap.data();
      document.getElementById("userPoints").innerText = data.puntos || 0;
      await cargarRankingGlobal();
    }
  });
}

// ===== EXPONER FUNCIONES PARA EVENTOS INLINE =====
window.enviarSolicitudModule = enviarSolicitud;
window.aceptarSolicitudModule = aceptarSolicitud;
window.rechazarSolicitudModule = rechazarSolicitud;
window.eliminarAmigoModule = eliminarAmigo;

// ===== NAVEGACIÓN POR PESTAÑAS =====
function switchTab(tabId, element) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  element.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchSubTab(subTabType) {
  const rankingBox = document.getElementById('subtab-ranking');
  const amigosBox = document.getElementById('subtab-amigos');
  const chips = document.querySelectorAll('.chip');
  if (subTabType === 'ranking') {
    rankingBox.style.display = 'block';
    amigosBox.style.display = 'none';
    chips[0].classList.add('active');
    chips[1].classList.remove('active');
  } else {
    rankingBox.style.display = 'none';
    amigosBox.style.display = 'block';
    chips[0].classList.remove('active');
    chips[1].classList.add('active');
  }
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', function() {
    switchTab(this.dataset.tab, this);
  });
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', function() {
    switchSubTab(this.dataset.subtab);
  });
});

// ===== AUTENTICACIÓN =====
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }
  currentUser = user;
  console.log("✅ Usuario autenticado:", user.uid);
  
  // Iniciar sistema de estado local
  statusManager.start(user.uid);
  
  await asegurarPerfilUsuario(user);
  await cargarPerfil(user);
  generarQR();
  await cargarRankingGlobal();
  cargarAmigos();
  escucharCambiosPuntos();
  onSnapshot(doc(db, "usuarios", user.uid), () => {
    cargarAmigos();
  });
});
</script>
