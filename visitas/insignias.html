<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 Libreta de Insignias · Visitas Pinolera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 10% 30%, #0b2b5e, #102a4e);
      background-attachment: fixed;
    }

    .container {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border-radius: 48px;
      padding: 40px 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f9e05d, #f5b342);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-shadow: 0 2px 10px rgba(245, 179, 66, 0.2);
    }

    .header h1 span {
      font-size: 2.6rem;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.65);
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.5px;
      margin-top: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 14px;
      width: 100%;
      text-align: center;
    }

    .album {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px;
      margin-top: 10px;
    }

    .badge-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 24px 18px 22px;
      width: 280px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      animation: floatIn 0.7s ease backwards;
    }

    .badge-card:nth-child(2) { animation-delay: 0.15s; }

    .badge-card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: rgba(255, 215, 0, 0.3);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 20px 40px -8px rgba(0, 0, 0, 0.6);
    }

    .badge-card.completed {
      border-color: #FFD700;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.25), 0 8px 25px rgba(0, 0, 0, 0.5);
      background: rgba(255, 215, 0, 0.05);
    }

    .badge-card .image-wrapper {
      width: 100%;
      height: 160px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: 0.3s;
      background: #0a1a2e;
    }

    .badge-card .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .badge-card:hover .image-wrapper img {
      transform: scale(1.04);
    }

    .badge-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
      line-height: 1.3;
    }

    .badge-sub {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 400;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }

    .badge-status {
      font-size: 1rem;
      font-weight: 600;
      margin: 8px 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.75);
    }

    .badge-status .lock-icon {
      font-size: 1.5rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .progress-mini {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      height: 8px;
      margin: 14px 0 6px;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    }

    .progress-mini-fill {
      background: linear-gradient(90deg, #f9d976, #f39c12);
      height: 100%;
      width: 0%;
      border-radius: 40px;
      transition: width 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
      box-shadow: 0 0 12px #f1c40f80;
    }

    .progress-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .btn-visit {
      background: linear-gradient(135deg, #f5b342, #f39c12);
      color: #0b1f33;
      padding: 12px 24px;
      border: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 14px;
      transition: 0.25s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(243, 156, 18, 0.25);
      width: 100%;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-visit:hover {
      background: linear-gradient(135deg, #f7c35c, #e08e0b);
      transform: scale(1.02);
      box-shadow: 0 10px 28px rgba(243, 156, 18, 0.4);
      color: #031016;
    }

    .btn-visit:active {
      transform: scale(0.97);
    }

    .completed .btn-visit {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      box-shadow: 0 6px 18px rgba(46, 204, 113, 0.25);
      border-color: rgba(46, 204, 113, 0.3);
    }

    .completed .btn-visit:hover {
      background: linear-gradient(135deg, #3ddc84, #2ecc71);
      box-shadow: 0 10px 28px rgba(46, 204, 113, 0.4);
    }

    .badge-card .badge-emoji {
      font-size: 2rem;
      margin-bottom: 6px;
      display: block;
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(40px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* responsive */
    @media (max-width: 640px) {
      .container { padding: 28px 16px; }
      .header h1 { font-size: 2.2rem; }
      .badge-card { width: 100%; max-width: 340px; }
    }

    /* glow sutil para el título */
    .glow-text {
      text-shadow: 0 0 30px rgba(245, 179, 66, 0.15);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <span>🏆</span> Libreta de Insignias
      </h1>
      <p class="subtitle">✦ Colecciona recuerdos de tus aventuras virtuales ✦</p>
    </div>

    <div class="album" id="albumContainer">
      <!-- Tarjeta 1: Parque Diriamba -->
      <div class="badge-card" id="diriambaCard">
        <div class="image-wrapper">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Parque_Central_Diriamba.jpg/640px-Parque_Central_Diriamba.jpg" alt="Parque Central Diriamba" loading="lazy">
        </div>
        <h3 class="badge-name">Parque Central de Diriamba</h3>
        <div class="badge-sub">📍 Diriamba, Carazo</div>
        <span class="badge-status" id="statusTextDiriamba">
          <span class="lock-icon">🔒</span> No obtenida
        </span>
        <div class="progress-mini">
          <div class="progress-mini-fill" id="diriambaProgressFill"></div>
        </div>
        <div class="progress-label" id="progressLabelDiriamba">0%</div>
        <a href="visita-parque-diriamba.html" class="btn-visit" id="visitBtnDiriamba">
          <span>🔍</span> Iniciar Visita
        </a>
      </div>

      <!-- Tarjeta 2: Basílica Menor de San Sebastián -->
      <div class="badge-card" id="basilicaCard">
        <div class="image-wrapper">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmM7ewSA1LlWGdyuSS1fg9xAsQSnkmRlsOhvzQJo3t4Q&s=10" alt="Basílica Menor de San Sebastián" loading="lazy">
        </div>
        <h3 class="badge-name">Basílica Menor de San Sebastián</h3>
        <div class="badge-sub">⛪ Diriamba, Carazo</div>
        <span class="badge-status" id="statusTextBasilica">
          <span class="lock-icon">🔒</span> No obtenida
        </span>
        <div class="progress-mini">
          <div class="progress-mini-fill" id="basilicaProgressFill"></div>
        </div>
        <div class="progress-label" id="progressLabelBasilica">0%</div>
        <a href="/visitas/basilica/index.html" class="btn-visit" id="visitBtnBasilica">
          <span>🔍</span> Iniciar Visita
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA6jVICuE17KJcO34gE1brMxqWEfNd3Fy0",
      authDomain: "mapa-41b00.firebaseapp.com",
      projectId: "mapa-41b00",
      storageBucket: "mapa-41b00.firebasestorage.app",
      messagingSenderId: "535032835400",
      appId: "1:535032835400:web:68c079cbc3f419eafd177d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    signInAnonymously(auth).catch(console.error);

    onAuthStateChanged(auth, (user) => {
      if (!user) return;

      // ----- escucha para Diriamba (parque) -----
      const lugarRef = doc(db, "users", user.uid, "explorer", "parque_diriamba");
      onSnapshot(lugarRef, (docSnap) => {
        let data = { token1: false, token2: false, progress: 0, badge: false };
        if (docSnap.exists()) data = docSnap.data();

        const card = document.getElementById("diriambaCard");
        const statusText = document.getElementById("statusTextDiriamba");
        const progressFill = document.getElementById("diriambaProgressFill");
        const progressLabel = document.getElementById("progressLabelDiriamba");

        const progress = Math.min(100, data.progress || 0);
        progressFill.style.width = `${progress}%`;
        progressLabel.textContent = `${progress}%`;

        if (data.badge === true) {
          card.classList.add("completed");
          statusText.innerHTML = `<span style="font-size:1.3rem;">🏅</span> Completada`;
        } else if (progress > 0) {
          statusText.innerHTML = `<span style="font-size:1.2rem;">🔍</span> En progreso`;
        } else {
          statusText.innerHTML = `<span class="lock-icon">🔒</span> No obtenida`;
        }
      });

      // ----- escucha para Basílica (usando el mismo documento o uno separado) -----
      // Asumimos que usas el mismo documento 'parque_diriamba' para simplificar,
      // pero si quieres separado, cambia el path. Para este demo, usamos el mismo
      // pero puedes duplicar la lógica con otro doc. 
      // Si quieres un doc separado, descomenta y ajusta:
      // const basilicaRef = doc(db, "users", user.uid, "explorer", "basilica");
      // Por ahora, usamos el mismo para que funcione con el ejemplo, 
      // pero lo dejamos como referencia. 
      // Para demostrar dos tarjetas con estados independientes, 
      // usaremos el mismo doc pero con un 'tipo' o simplemente el mismo estado.
      // En una app real, cada lugar tendría su propio doc.
      // Para que la segunda tarjeta también reaccione, la vinculamos al mismo doc
      // pero podrías cambiarlo por "basilica" si existe.
      const basilicaRef = doc(db, "users", user.uid, "explorer", "parque_diriamba"); 
      onSnapshot(basilicaRef, (docSnap) => {
        let data = { token1: false, token2: false, progress: 0, badge: false };
        if (docSnap.exists()) data = docSnap.data();

        const card = document.getElementById("basilicaCard");
        const statusText = document.getElementById("statusTextBasilica");
        const progressFill = document.getElementById("basilicaProgressFill");
        const progressLabel = document.getElementById("progressLabelBasilica");

        const progress = Math.min(100, data.progress || 0);
        progressFill.style.width = `${progress}%`;
        progressLabel.textContent = `${progress}%`;

        if (data.badge === true) {
          card.classList.add("completed");
          statusText.innerHTML = `<span style="font-size:1.3rem;">🏅</span> Completada`;
        } else if (progress > 0) {
          statusText.innerHTML = `<span style="font-size:1.2rem;">🔍</span> En progreso`;
        } else {
          statusText.innerHTML = `<span class="lock-icon">🔒</span> No obtenida`;
        }
      });
    });
  </script>
</body>
</html>
