<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>📊 Estadísticas – Visitas Pinolera</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ============================================================
       ESTADÍSTICAS · Diseño inmersivo y premium
       Paleta: #232049, #a4c737, #a287be, #fbfbfb
       ============================================================ */

    /* ----- FUENTES ----- */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    @font-face {
      font-family: 'Myriad Pro';
      src: local('Myriad Pro'), local('MyriadPro-Regular');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Myriad Pro';
      src: local('Myriad Pro Bold'), local('MyriadPro-Bold');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Cascadia Mono Light';
      src: local('Cascadia Mono Light'), local('CascadiaMono-Light');
      font-weight: 300;
      font-display: swap;
    }

    /* ----- VARIABLES ----- */
    :root {
      --primary: #a4c737;
      --primary-dark: #8ab32e;
      --primary-light: #c0e05a;
      --secondary: #a287be;
      --secondary-dark: #8a73a8;
      --secondary-light: #c4b5d8;
      --bg-dark: #232049;
      --bg-light: #fbfbfb;
      --text-light: #fbfbfb;
      --text-muted: rgba(251, 251, 251, 0.7);
      --shadow-card: 0 30px 60px rgba(0, 0, 0, 0.6);
      --border-radius: 32px;
      --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* ----- RESET ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Myriad Pro', 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(ellipse at 40% 30%, #1e1b42, #0b0f1f);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    /* ----- FONDO DECORATIVO ----- */
    .bg-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow--1 {
      width: 600px;
      height: 600px;
      background: rgba(164, 199, 55, 0.06);
      top: -200px;
      right: -150px;
      animation: floatGlow 22s ease-in-out infinite alternate;
    }
    .bg-glow--2 {
      width: 500px;
      height: 500px;
      background: rgba(162, 135, 190, 0.05);
      bottom: -150px;
      left: -150px;
      animation: floatGlow 28s ease-in-out infinite alternate-reverse;
    }
    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 40px) scale(1.15); }
    }

    /* ----- DASHBOARD (Glassmorphism) ----- */
    .dashboard {
      max-width: 860px;
      width: 100%;
      background: rgba(35, 32, 73, 0.55);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-radius: var(--border-radius);
      padding: 42px 38px 38px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: var(--shadow-card), 0 0 0 1px rgba(255, 255, 255, 0.04);
      position: relative;
      z-index: 1;
      animation: slideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      transition: all var(--transition);
    }

    .dashboard:hover {
      border-color: rgba(164, 199, 55, 0.1);
      box-shadow: var(--shadow-card), 0 0 50px rgba(164, 199, 55, 0.04);
    }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(50px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ----- TÍTULO ----- */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-badge {
      display: inline-block;
      background: rgba(164, 199, 55, 0.10);
      padding: 5px 18px;
      border-radius: 60px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary-light);
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid rgba(164, 199, 55, 0.12);
      margin-bottom: 14px;
      backdrop-filter: blur(4px);
    }

    h1 {
      font-family: 'Myriad Pro', 'Inter', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f5e56b, #a4c737, #a287be);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradShift 5s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    h1 i {
      font-size: 2rem;
      background: none;
      -webkit-background-clip: unset;
      background-clip: unset;
      color: var(--primary);
    }

    @keyframes gradShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* ----- GRID DE ESTADÍSTICAS ----- */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 20px 14px 18px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(164, 199, 55, 0.04), transparent 70%);
      opacity: 0;
      transition: opacity var(--transition);
    }

    .stat-card:hover::before {
      opacity: 1;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: rgba(164, 199, 55, 0.15);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    }

    .stat-icon {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 6px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
      transition: transform var(--transition);
    }

    .stat-card:hover .stat-icon {
      transform: scale(1.1) rotate(-3deg);
    }

    .stat-value {
      font-family: 'Cascadia Mono Light', 'Cascadia Mono', monospace;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-light), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.4px;
      font-weight: 500;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ----- NIVEL (Premium) ----- */
    .level-box {
      background: linear-gradient(135deg, #2a2555, var(--bg-dark));
      border-radius: 20px;
      padding: 22px 24px 20px;
      text-align: center;
      border: 1px solid rgba(164, 199, 55, 0.12);
      position: relative;
      overflow: hidden;
      transition: all var(--transition);
      margin-bottom: 20px;
    }

    .level-box::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -30%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(164, 199, 55, 0.04), transparent 60%);
      animation: rotateBg 25s linear infinite;
      pointer-events: none;
    }

    @keyframes rotateBg {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .level-box:hover {
      border-color: rgba(164, 199, 55, 0.25);
      transform: scale(1.01);
      box-shadow: 0 8px 30px rgba(164, 199, 55, 0.06);
    }

    .level-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    .level-name {
      font-family: 'Myriad Pro', 'Inter', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      position: relative;
      z-index: 1;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    /* ----- BARRA DE PROGRESO ----- */
    .progress-extra {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      padding: 18px 20px 16px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .progress-extra .label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .progress-extra .label span:last-child {
      font-family: 'Cascadia Mono Light', monospace;
      font-weight: 600;
      color: var(--primary-light);
    }

    .progress-extra .track {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 40px;
      height: 10px;
      overflow: hidden;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .progress-extra .fill {
      height: 100%;
      border-radius: 40px;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      background-size: 200% 100%;
      animation: flowGrad 2.5s ease-in-out infinite;
      transition: width 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
      box-shadow: 0 0 20px rgba(164, 199, 55, 0.15);
    }

    @keyframes flowGrad {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 768px) {
      .dashboard { padding: 28px 20px 24px; }
      h1 { font-size: 2rem; gap: 10px; }
      h1 i { font-size: 1.5rem; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .stat-card { padding: 16px 10px 14px; }
      .stat-value { font-size: 1.6rem; }
      .stat-icon { font-size: 1.8rem; }
      .level-name { font-size: 1.6rem; }
    }

    @media (max-width: 500px) {
      body { padding: 12px; }
      .dashboard { padding: 20px 14px 18px; border-radius: 24px; }
      .header { margin-bottom: 20px; }
      .header-badge { font-size: 0.6rem; padding: 4px 12px; }
      h1 { font-size: 1.5rem; gap: 6px; flex-wrap: wrap; }
      h1 i { font-size: 1.2rem; }
      .grid { gap: 8px; }
      .stat-card { padding: 12px 6px 10px; border-radius: 14px; }
      .stat-value { font-size: 1.3rem; }
      .stat-icon { font-size: 1.4rem; margin-bottom: 2px; }
      .stat-label { font-size: 0.6rem; letter-spacing: 0.2px; }
      .level-box { padding: 16px 14px; border-radius: 16px; }
      .level-title { font-size: 0.7rem; }
      .level-name { font-size: 1.3rem; }
      .progress-extra { padding: 14px 14px 12px; }
      .progress-extra .label { font-size: 0.75rem; }
      .progress-extra .track { height: 8px; }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      .dashboard { padding: 18px 22px; }
      h1 { font-size: 1.6rem; margin-bottom: 12px; }
      .grid { grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
      .stat-card { padding: 10px 8px; }
      .stat-value { font-size: 1.3rem; }
      .stat-icon { font-size: 1.3rem; margin-bottom: 0; }
      .stat-label { font-size: 0.6rem; }
      .level-box { padding: 12px 16px; margin-bottom: 12px; }
      .level-name { font-size: 1.4rem; }
      .progress-extra { padding: 12px 16px; }
    }

    /* ===== SCROLL ===== */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--secondary); }

    ::selection {
      background: var(--primary);
      color: var(--bg-dark);
    }
  </style>
</head>
<body>

  <!-- Luces de fondo -->
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <!-- DASHBOARD -->
  <div class="dashboard">
    <div class="header">
      <span class="header-badge"><i class="fas fa-chart-simple"></i> Panel de Progreso</span>
      <h1>
        <i class="fas fa-chart-pie"></i>
        Estadísticas
        <i class="fas fa-chart-line"></i>
      </h1>
    </div>

    <!-- Grid de estadísticas -->
    <div class="grid">
      <div class="stat-card">
        <span class="stat-icon">🏆</span>
        <div class="stat-value" id="badgeCount">0</div>
        <div class="stat-label">Insignias</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">📍</span>
        <div class="stat-value" id="placesCompleted">0/1</div>
        <div class="stat-label">Visitados</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">🔎</span>
        <div class="stat-value" id="tokensFound">0</div>
        <div class="stat-label">Tokens</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">📈</span>
        <div class="stat-value" id="overallProgress">0%</div>
        <div class="stat-label">Avance</div>
      </div>
    </div>

    <!-- Nivel -->
    <div class="level-box">
      <div class="level-title">🎖 Nivel actual</div>
      <div class="level-name" id="levelName">Aprendiz de Viajero</div>
    </div>

    <!-- Barra de progreso -->
    <div class="progress-extra">
      <div class="label">
        <span>Progreso total</span>
        <span id="progressLabel">0%</span>
      </div>
      <div class="track">
        <div class="fill" id="progressFill" style="width: 0%;"></div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       FIREBASE
       ============================================================ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA6jVICuE17KJcO34gE1brMxqWEfNd3Fy0",
      authDomain: "mapa-41b00.firebaseapp.com",
      projectId: "mapa-41b00",
      storageBucket: "mapa-41b00.firebasestorage.app",
      messagingSenderId: "535032835400",
      appId: "1:535032835400:web:68c079cbc3f419eafd177d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    signInAnonymously(auth).catch(console.error);

    function getLevel(badgeCount) {
      if (badgeCount >= 50) return "🌋 Leyenda Pinolera";
      if (badgeCount >= 30) return "🏛️ Maestro del Patrimonio";
      if (badgeCount >= 20) return "🌟 Embajador Pinolero";
      if (badgeCount >= 10) return "🧭 Explorador Experto";
      if (badgeCount >= 5) return "🗺️ Explorador Cultural";
      if (badgeCount >= 1) return "🌱 Explorador Novato";
      return "🆕 Aprendiz de Viajero";
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) return;

      const lugarRef = doc(db, "users", user.uid, "explorer", "parque_diriamba");

      onSnapshot(lugarRef, (docSnap) => {
        let data = { token1: false, token2: false, progress: 0, badge: false };
        if (docSnap.exists()) data = docSnap.data();

        const progress = Math.min(100, data.progress || 0);
        const badgeCount = data.badge ? 1 : 0;
        const tokensFound = (data.token1 ? 1 : 0) + (data.token2 ? 1 : 0);
        const placesCompleted = data.badge ? "1/1" : "0/1";

        // Actualizar UI
        document.getElementById("badgeCount").textContent = badgeCount;
        document.getElementById("placesCompleted").textContent = placesCompleted;
        document.getElementById("tokensFound").textContent = tokensFound;
        document.getElementById("overallProgress").textContent = `${progress}%`;

        document.getElementById("levelName").textContent = getLevel(badgeCount);

        const fill = document.getElementById("progressFill");
        fill.style.width = `${progress}%`;
        document.getElementById("progressLabel").textContent = `${progress}%`;

        // Efecto especial al 100%
        if (progress === 100) {
          fill.style.background = "linear-gradient(90deg, #FFD700, #FFA500, #FFD700)";
          fill.style.backgroundSize = "200% 100%";
          document.getElementById("progressLabel").style.color = "#FFD700";
        } else {
          fill.style.background = "";
          document.getElementById("progressLabel").style.color = "";
        }
      });
    });
  </script>
</body>
</html>
