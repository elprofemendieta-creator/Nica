<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🇳🇮 Visitas Pinolera · Guía Turística</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* ============================================================
       VISITAS PINOLERA · Diseño inmersivo
       Paleta: #232049, #a4c737, #a287be, #fbfbfb
       ============================================================ */

    /* ----- FUENTES ----- */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    @font-face {
      font-family: 'Myriad Pro';
      src: local('Myriad Pro'), local('MyriadPro-Regular');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Myriad Pro';
      src: local('Myriad Pro Bold'), local('MyriadPro-Bold');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Cascadia Mono Light';
      src: local('Cascadia Mono Light'), local('CascadiaMono-Light');
      font-weight: 300;
      font-display: swap;
    }

    /* ----- VARIABLES ----- */
    :root {
      --primary: #a4c737;
      --primary-dark: #8ab32e;
      --primary-light: #c0e05a;
      --secondary: #a287be;
      --secondary-dark: #8a73a8;
      --bg-dark: #232049;
      --bg-light: #fbfbfb;
      --text-light: #fbfbfb;
      --text-muted: rgba(251, 251, 251, 0.7);
      --shadow-card: 0 30px 60px rgba(0, 0, 0, 0.6);
      --border-radius: 32px;
      --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* ----- RESET ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Myriad Pro', 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(ellipse at 30% 20%, #1a1a3e, #0b0f1f);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    /* ----- FONDO DECORATIVO ----- */
    .bg-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow--1 {
      width: 500px;
      height: 500px;
      background: rgba(164, 199, 55, 0.08);
      top: -150px;
      right: -100px;
      animation: floatGlow 20s ease-in-out infinite alternate;
    }
    .bg-glow--2 {
      width: 400px;
      height: 400px;
      background: rgba(162, 135, 190, 0.06);
      bottom: -100px;
      left: -100px;
      animation: floatGlow 25s ease-in-out infinite alternate-reverse;
    }
    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.2); }
    }

    /* ----- TARJETA PRINCIPAL (Glassmorphism) ----- */
    .hero {
      width: 100%;
      max-width: 880px;
      background: rgba(35, 32, 73, 0.55);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-radius: var(--border-radius);
      padding: 48px 40px 42px;
      box-shadow: var(--shadow-card), 0 0 0 1px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      z-index: 1;
      animation: slideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      transition: all var(--transition);
    }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(50px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hero:hover {
      border-color: rgba(164, 199, 55, 0.15);
      box-shadow: var(--shadow-card), 0 0 40px rgba(164, 199, 55, 0.05);
    }

    /* ----- ENCABEZADO ----- */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-badge {
      display: inline-block;
      background: rgba(164, 199, 55, 0.12);
      padding: 6px 18px;
      border-radius: 60px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary-light);
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid rgba(164, 199, 55, 0.15);
      margin-bottom: 16px;
      backdrop-filter: blur(4px);
    }

    h1 {
      font-family: 'Myriad Pro', 'Inter', sans-serif;
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #f5e56b, #a4c737, #a287be);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradShift 5s ease-in-out infinite;
      line-height: 1.2;
    }

    @keyframes gradShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 560px;
      margin: 10px auto 0;
      line-height: 1.7;
      font-weight: 300;
      letter-spacing: 0.2px;
    }
    .subtitle i {
      color: var(--primary);
      margin: 0 3px;
    }

    /* ----- TARJETA DE PROGRESO (mejorada) ----- */
    .progress-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px 28px 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 28px;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }

    .progress-card::before {
      content: '';
      position: absolute;
      top: -60%;
      right: -30%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(164, 199, 55, 0.04) 0%, transparent 60%);
      animation: rotateBg 30s linear infinite;
      pointer-events: none;
    }

    @keyframes rotateBg {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .progress-card:hover {
      border-color: rgba(164, 199, 55, 0.15);
      transform: translateY(-2px);
    }

    /* ----- ESTADÍSTICAS ----- */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 22px;
      position: relative;
      z-index: 1;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      padding: 14px 10px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all var(--transition);
      backdrop-filter: blur(4px);
    }

    .stat-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(164, 199, 55, 0.12);
      transform: scale(1.02);
    }

    .stat-icon {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 4px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    .stat-value {
      font-family: 'Cascadia Mono Light', 'Cascadia Mono', monospace;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-light), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      font-weight: 500;
      text-transform: uppercase;
    }

    /* ----- BARRA DE PROGRESO ----- */
    .progress-track {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 40px;
      height: 14px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
      margin-bottom: 6px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 40px;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--secondary));
      background-size: 200% 100%;
      animation: flowGrad 2.5s ease-in-out infinite;
      transition: width 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
      position: relative;
      box-shadow: 0 0 20px rgba(164, 199, 55, 0.2);
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      animation: shimmer 2s ease-in-out infinite;
    }

    @keyframes flowGrad {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-label {
      font-family: 'Cascadia Mono Light', monospace;
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      font-weight: 400;
      position: relative;
      z-index: 1;
    }

    /* ----- BOTONES ----- */
    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 60px;
      font-family: 'Myriad Pro', 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text-light);
      transition: all var(--transition);
      min-height: 54px;
      flex: 1 1 auto;
      min-width: 180px;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .btn:hover::before { opacity: 1; }

    .btn:hover {
      transform: translateY(-3px);
      border-color: rgba(164, 199, 55, 0.25);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
    }
    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-color: var(--primary);
      color: var(--bg-dark);
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(164, 199, 55, 0.2);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      box-shadow: 0 8px 35px rgba(164, 199, 55, 0.35);
      border-color: var(--primary-light);
    }

    .btn-secondary {
      border-color: rgba(162, 135, 190, 0.2);
    }
    .btn-secondary:hover {
      border-color: var(--secondary);
      background: rgba(162, 135, 190, 0.08);
      box-shadow: 0 8px 30px rgba(162, 135, 190, 0.15);
    }

    .btn i {
      font-size: 1.1rem;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 768px) {
      .hero { padding: 32px 20px 28px; }
      h1 { font-size: 2.4rem; }
      .subtitle { font-size: 1rem; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .stat-value { font-size: 1.6rem; }
      .stat-icon { font-size: 1.5rem; }
      .btn { padding: 12px 20px; font-size: 0.9rem; min-height: 48px; min-width: 140px; }
    }

    @media (max-width: 500px) {
      body { padding: 12px; }
      .hero { padding: 24px 14px 20px; border-radius: 24px; }
      h1 { font-size: 1.9rem; }
      .subtitle { font-size: 0.9rem; margin-top: 6px; }
      .header-badge { font-size: 0.65rem; padding: 4px 14px; }
      .progress-card { padding: 18px 14px 16px; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stat-item { padding: 10px 4px; border-radius: 14px; }
      .stat-value { font-size: 1.3rem; }
      .stat-label { font-size: 0.6rem; }
      .stat-icon { font-size: 1.2rem; }
      .progress-track { height: 10px; }
      .progress-label { font-size: 0.7rem; }
      .btn { padding: 10px 14px; font-size: 0.8rem; min-height: 42px; min-width: 100px; gap: 6px; }
      .actions { flex-direction: column; align-items: stretch; gap: 10px; }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      .hero { padding: 20px 18px; }
      h1 { font-size: 2rem; }
      .subtitle { font-size: 0.85rem; margin-bottom: 8px; }
      .progress-card { padding: 14px 16px; margin-bottom: 14px; }
      .stats { margin-bottom: 12px; gap: 8px; }
      .stat-item { padding: 6px 8px; }
      .stat-value { font-size: 1.2rem; }
      .stat-icon { font-size: 1.1rem; }
      .btn { padding: 8px 16px; font-size: 0.8rem; min-height: 36px; }
    }

    /* ===== SCROLL ===== */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--secondary); }

    ::selection {
      background: var(--primary);
      color: var(--bg-dark);
    }
  </style>
</head>
<body>

  <!-- Luces de fondo -->
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <!-- TARJETA PRINCIPAL -->
  <div class="hero">
    <div class="header">
      <span class="header-badge"><i class="fas fa-compass"></i> Explorador Pinolero</span>
      <h1>🇳🇮 Visitas Pinolera</h1>
      <p class="subtitle">
        <i class="fas fa-map-pin"></i> Recorre virtualmente los rincones más bellos de Nicaragua,
        descubre secretos <i class="fas fa-star"></i> y colecciona insignias.
      </p>
    </div>

    <!-- Progreso -->
    <div class="progress-card">
      <div class="stats">
        <div class="stat-item">
          <span class="stat-icon">🏆</span>
          <span class="stat-value" id="badgeCount">0</span>
          <span class="stat-label">Insignias</span>
        </div>
        <div class="stat-item">
          <span class="stat-icon">📍</span>
          <span class="stat-value" id="placesCompleted">0/1</span>
          <span class="stat-label">Visitados</span>
        </div>
        <div class="stat-item">
          <span class="stat-icon">📈</span>
          <span class="stat-value" id="overallProgress">0%</span>
          <span class="stat-label">Avance</span>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <div class="progress-label" id="progressLabel">0% completado</div>
    </div>

    <!-- Acciones -->
    <div class="actions">
      <a href="insignias.html" class="btn btn-primary">
        <i class="fas fa-award"></i> Libreta de Insignias
      </a>
      <a href="estadisticas.html" class="btn btn-secondary">
        <i class="fas fa-chart-simple"></i> Estadísticas
      </a>
    </div>
  </div>

  <!-- ============================================================
       FIREBASE
       ============================================================ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA6jVICuE17KJcO34gE1brMxqWEfNd3Fy0",
      authDomain: "mapa-41b00.firebaseapp.com",
      projectId: "mapa-41b00",
      storageBucket: "mapa-41b00.firebasestorage.app",
      messagingSenderId: "535032835400",
      appId: "1:535032835400:web:68c079cbc3f419eafd177d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    signInAnonymously(auth).catch(console.error);

    onAuthStateChanged(auth, (user) => {
      if (!user) return;

      const lugarRef = doc(db, "users", user.uid, "explorer", "parque_diriamba");

      onSnapshot(lugarRef, (docSnap) => {
        let data = { token1: false, token2: false, progress: 0, badge: false };
        if (docSnap.exists()) data = docSnap.data();

        const progress = Math.min(100, data.progress || 0);
        const badgeCount = data.badge ? 1 : 0;
        const completed = data.badge ? 1 : 0;

        // Actualizar UI
        document.getElementById("badgeCount").textContent = badgeCount;
        document.getElementById("placesCompleted").textContent = `${completed}/1`;
        document.getElementById("overallProgress").textContent = `${progress}%`;

        const fill = document.getElementById("progressFill");
        fill.style.width = `${progress}%`;
        document.getElementById("progressLabel").textContent = `${progress}% completado`;

        // Efecto especial al 100%
        if (progress === 100) {
          fill.style.background = "linear-gradient(90deg, #FFD700, #FFA500, #FFD700)";
          fill.style.backgroundSize = "200% 100%";
          document.getElementById("progressLabel").style.color = "#FFD700";
          document.getElementById("progressLabel").style.fontWeight = "600";
        } else {
          fill.style.background = "";
          document.getElementById("progressLabel").style.color = "";
          document.getElementById("progressLabel").style.fontWeight = "";
        }
      });
    });
  </script>
</body>
</html>
