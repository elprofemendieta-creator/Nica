<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guía Pinolera · Nicaragua</title>
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
               RESET Y VARIABLES
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --fondo: #0f0e0d;
            --fondo-tarjeta: #1c1815;
            --texto: #f2ebe4;
            --texto-sec: #b8a99a;
            --oro: #e6b17e;
            --oro-suave: #f4d3b3;
            --oro-brillante: #f7d9b0;
            --verde-profundo: #1d2c1a;
            --sombra: 0 20px 60px rgba(0, 0, 0, 0.8);
            --borde: rgba(230, 177, 126, 0.15);
            --radio: 24px;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 10% 20%, rgba(230, 177, 126, 0.03) 0%, transparent 50%);
        }

        /* ============================================================
               CONTENEDOR PRINCIPAL
               ============================================================ */
        .contenedor {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--fondo-tarjeta);
            border-radius: var(--radio);
            padding: 2.5rem;
            border: 1px solid var(--borde);
            box-shadow: var(--sombra);
            backdrop-filter: blur(4px);
            position: relative;
            overflow: hidden;
        }

        .contenedor::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 10%, rgba(230, 177, 126, 0.03), transparent 60%);
            pointer-events: none;
        }

        /* ============================================================
               HEADER
               ============================================================ */
        .header-principal {
            text-align: center;
            padding: 0.5rem 0 2rem;
            border-bottom: 1px solid var(--borde);
            margin-bottom: 2.5rem;
            position: relative;
            z-index: 1;
        }

        .header-principal h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            background: linear-gradient(135deg, var(--oro-brillante), var(--oro), #c4956a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            text-shadow: 0 0 40px rgba(230, 177, 126, 0.1);
        }

        .header-principal p {
            color: var(--texto-sec);
            font-size: 1.15rem;
            margin-top: 0.25rem;
            letter-spacing: 0.3px;
        }

        .header-principal .tag {
            display: inline-block;
            background: rgba(230, 177, 126, 0.12);
            color: var(--oro);
            padding: 0.2rem 1.2rem;
            border-radius: 100px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0.5rem;
            border: 1px solid rgba(230, 177, 126, 0.15);
        }

        /* ============================================================
               BOTÓN SORPRESA (GLOW)
               ============================================================ */
        .btn-sorpresa {
            background: linear-gradient(135deg, var(--oro), #c4956a);
            border: none;
            color: #0f0e0d;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 0.9rem 3rem;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: 1.2rem 0 0.4rem;
            box-shadow: 0 8px 30px rgba(230, 177, 126, 0.25);
            letter-spacing: 0.3px;
            position: relative;
            z-index: 2;
        }

        .btn-sorpresa:hover {
            transform: scale(1.04) translateY(-3px);
            box-shadow: 0 12px 45px rgba(230, 177, 126, 0.45);
        }

        .btn-sorpresa:active {
            transform: scale(0.96);
        }

        /* ============================================================
               DESTINOS — GRID CON ESTILO
               ============================================================ */
        .grid-destinos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin: 2.5rem 0 1.5rem;
            position: relative;
            z-index: 1;
        }

        .destino-item {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(2px);
            padding: 1.2rem 0.5rem;
            text-align: center;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: default;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--texto-sec);
        }

        .destino-item:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(230, 177, 126, 0.06);
            border-color: rgba(230, 177, 126, 0.25);
            color: var(--texto);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        .destino-item .emoji {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 0.4rem;
        }

        /* ============================================================
               SECCIÓN PRÁCTICA — TARJETAS ELEGANTES
               ============================================================ */
        .seccion-utilidad {
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radio);
            padding: 2.2rem;
            margin: 2.5rem 0;
            border: 1px solid var(--borde);
            position: relative;
            z-index: 1;
        }

        .seccion-utilidad h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--oro-suave);
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .seccion-utilidad h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--borde), transparent);
        }

        .grid-utilidad {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 1.8rem;
        }

        .tarjeta-util {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(2px);
            padding: 1.8rem 1.5rem;
            border-radius: 18px;
            border: 1px solid var(--borde);
            transition: all 0.4s ease;
        }

        .tarjeta-util:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(230, 177, 126, 0.2);
            transform: translateY(-4px);
        }

        .tarjeta-util h3 {
            color: var(--oro);
            font-weight: 600;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 1.2rem;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ---------- FRASES ---------- */
        .item-frase {
            background: rgba(230, 177, 126, 0.04);
            margin: 0.6rem 0;
            padding: 0.7rem 1rem;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s;
            border-left: 2px solid transparent;
        }

        .item-frase:hover {
            background: rgba(230, 177, 126, 0.08);
            border-left-color: var(--oro);
        }

        .frase {
            font-weight: 600;
            color: var(--oro-suave);
        }

        .significado {
            margin-top: 0.4rem;
            color: var(--texto-sec);
            font-size: 0.9rem;
            border-top: 1px dashed rgba(230, 177, 126, 0.15);
            padding-top: 0.4rem;
        }

        /* ---------- CALCULADORA ---------- */
        .calc-inputs {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .calc-inputs label {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-size: 0.85rem;
            color: var(--texto-sec);
            font-weight: 500;
        }

        .calc-inputs input,
        .calc-inputs select {
            padding: 0.7rem 1rem;
            border-radius: 14px;
            border: 1px solid var(--borde);
            background: rgba(0, 0, 0, 0.3);
            color: var(--texto);
            font-size: 0.95rem;
            transition: border 0.25s;
            font-family: 'Inter', sans-serif;
        }

        .calc-inputs input:focus,
        .calc-inputs select:focus {
            outline: none;
            border-color: var(--oro);
        }

        .calc-inputs button {
            background: var(--oro);
            color: #0f0e0d;
            border: none;
            padding: 0.8rem;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
        }

        .calc-inputs button:hover {
            background: var(--oro-brillante);
            transform: scale(1.01);
        }

        .resultado-calc {
            margin-top: 1.2rem;
            padding: 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            border-left: 3px solid var(--oro);
        }

        .resultado-calc p {
            margin: 0.3rem 0;
        }

        .barra-presupuesto {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin: 0.6rem 0;
            overflow: hidden;
        }

        .barra-llenado {
            height: 100%;
            background: linear-gradient(90deg, var(--oro), var(--oro-brillante));
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        /* ---------- CALENDARIO ---------- */
        .item-calendario {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.9rem;
            gap: 0.5rem;
        }

        .item-calendario.destacado {
            background: rgba(230, 177, 126, 0.06);
            border-radius: 12px;
            border-left: 3px solid var(--oro);
            padding-left: 0.8rem;
        }

        .mes-cal {
            font-weight: 600;
            color: var(--oro);
            white-space: nowrap;
        }

        .evento-cal {
            color: var(--texto-sec);
            text-align: right;
            font-size: 0.85rem;
        }

        .alerta-mes {
            background: rgba(230, 177, 126, 0.06);
            padding: 0.6rem 1rem;
            border-radius: 14px;
            margin-bottom: 1rem;
            text-align: center;
            border: 1px solid var(--borde);
            font-size: 0.85rem;
            color: var(--texto-sec);
        }

        .alerta-mes strong {
            color: var(--oro);
        }

        /* ============================================================
               MODAL — ELEGANTE
               ============================================================ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .modal.mostrar {
            display: flex;
        }

        .modal-contenido {
            background: var(--fondo-tarjeta);
            padding: 2.5rem;
            max-width: 520px;
            width: 100%;
            border-radius: 28px;
            border: 1px solid var(--borde);
            color: var(--texto);
            animation: aparecerModal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9);
        }

        @keyframes aparecerModal {
            from {
                transform: scale(0.92) translateY(30px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .cerrar-modal {
            position: absolute;
            top: 14px;
            right: 22px;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--texto-sec);
            transition: all 0.3s;
            line-height: 1;
        }

        .cerrar-modal:hover {
            color: var(--texto);
            transform: rotate(90deg);
        }

        .modal-contenido h2 {
            font-family: 'Playfair Display', serif;
            color: var(--oro-suave);
            margin-top: 0;
            margin-bottom: 1.2rem;
            font-size: 1.8rem;
        }

        .badge {
            background: var(--oro);
            color: #0f0e0d;
            padding: 0.2rem 1.2rem;
            border-radius: 100px;
            margin: 0.2rem 0.3rem 0.2rem 0;
            display: inline-block;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
        }

        .modal-contenido ul {
            list-style: none;
            padding: 0;
            margin: 1.2rem 0;
        }

        .modal-contenido ul li {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--texto-sec);
        }

        .modal-contenido .tip {
            background: rgba(230, 177, 126, 0.06);
            padding: 0.8rem 1.2rem;
            border-radius: 14px;
            border-left: 3px solid var(--oro);
            margin: 1.2rem 0;
            font-size: 0.95rem;
            color: var(--texto-sec);
        }

        .btn-accion {
            background: var(--oro);
            border: none;
            color: #0f0e0d;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            margin-right: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn-accion:hover {
            background: var(--oro-brillante);
            transform: translateY(-2px);
        }

        .btn-accion.secundario {
            background: transparent;
            border: 1.5px solid var(--borde);
            color: var(--texto-sec);
        }

        .btn-accion.secundario:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--oro);
            color: var(--texto);
        }

        /* ============================================================
               FOOTER
               ============================================================ */
        .footer {
            text-align: center;
            margin-top: 2.5rem;
            padding-top: 1.8rem;
            border-top: 1px solid var(--borde);
            color: var(--texto-sec);
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            position: relative;
            z-index: 1;
        }

        .footer span {
            color: var(--oro);
        }

        /* ============================================================
               RESPONSIVE
               ============================================================ */
        @media (max-width: 640px) {
            body {
                padding: 0.8rem;
            }
            .contenedor {
                padding: 1.2rem;
                border-radius: 18px;
            }
            .header-principal h1 {
                font-size: 2.2rem;
            }
            .header-principal p {
                font-size: 1rem;
            }
            .grid-destinos {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.7rem;
            }
            .destino-item {
                padding: 0.8rem 0.3rem;
                font-size: 0.8rem;
            }
            .destino-item .emoji {
                font-size: 1.6rem;
            }
            .grid-utilidad {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
            .seccion-utilidad {
                padding: 1.2rem;
            }
            .seccion-utilidad h2 {
                font-size: 1.5rem;
            }
            .modal-contenido {
                padding: 1.8rem;
            }
            .btn-sorpresa {
                padding: 0.7rem 1.8rem;
                font-size: 1rem;
            }
            .item-calendario {
                flex-wrap: wrap;
                gap: 0.2rem;
            }
            .evento-cal {
                text-align: left;
                width: 100%;
                padding-left: 0.3rem;
            }
        }

        @media (max-width: 400px) {
            .grid-destinos {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <!-- ===== HEADER ===== -->
        <header class="header-principal">
            <h1>🌋 Guía Pinolera</h1>
            <p>Explora Nicaragua con estilo</p>
            <span class="tag">✦ destino · cultura · aventura ✦</span>
            <br />
            <button class="btn-sorpresa" id="btnRuta">🎲 Ruta al Azar</button>
        </header>

        <!-- ===== DESTINOS ===== -->
        <section>

                </div>

                <!-- Calculadora -->
                <div class="tarjeta-util">
                    <h3>💰 Presupuesto</h3>
                    <div class="calc-inputs">
                        <label>Días
                            <input type="number" id="diasViaje" value="5" min="1" max="30" />
                        </label>
                        <label>Estilo
                            <select id="estiloViaje">
                                <option value="mochilero">🎒 Mochilero · $30/día</option>
                                <option value="estandar" selected>🏨 Estándar · $60/día</option>
                                <option value="lujo">🌟 Lujo · $120/día</option>
                            </select>
                        </label>
                        <button onclick="calcularPresupuesto()">Calcular</button>

                    <div class="resultado-calc" id="resultadoCalc"></div>
                </div>

                <!-- Calendario -->
                <div class="tarjeta-util">
                    <h3>📅 Calendario</h3>
                    <div class="contenido-calendario" id="contenedorCalendario"></div>
                </div>

            </div>
        </section>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            Hecho con <span>❤️</span> para explorar Nicaragua · 2026
        </footer>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal" id="modalRuta">
        <div class="modal-contenido">
            <span class="cerrar-modal" id="cerrarModalBtn">✕</span>

            <ul id="rutaActividades"></ul>
            <div class="tip" id="rutaTip">💡 Consejo: lleva ropa cómoda</div>
            <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.5rem;">
                <button class="btn-accion" onclick="generarRuta()">🔄 Otra Ruta</button>
                <button class="btn-accion secundario" onclick="cerrarModal()">🗺️ Ver Mapa</button>
            </div>
        </div>
    </div>

            { mes: "Octubre", evento: "Festival del Güegüense", emoji: "🎭" },
            { mes: "Noviembre", evento: "Feria del Café", emoji: "☕" },
            { mes: "Diciembre", evento: "La Gritería", emoji: "🕯️" }
        ];

        const costosDiarios = { mochilero: 30, estandar: 60, lujo: 120 };

        // ==========================================
        // RENDER
        // ==========================================
        function renderizarDestinos() {
            const grid = document.getElementById('gridDestinos');
            grid.innerHTML = destinos.map(d =>
                `<div class="destino-item"><span class="emoji">${d.emoji}</span>${d.nombre}</div>`
            ).join('');
        }

        function renderizarFrases() {
            const c = document.getElementById('contenedorFrases');
            c.innerHTML = frasesNicas.map((f, i) =>
                `<div class="item-frase" onclick="toggleFrase(${i})">
                        <div class="frase">${f.frase}</div>
                        <div class="significado" id="sig-${i}" style="display:none">${f.significado}</div>
                    </div>`
            ).join('');
        }

        window.toggleFrase = function(i) {
            const el = document.getElementById(`sig-${i}`);
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        };

        function renderizarCalendario() {
            const c = document.getElementById('contenedorCalendario');
            const mes = new Date().getMonth();
            let html =
                `<div class="alerta-mes">📌 Este mes: <strong>${festivales[mes].mes}</strong> · ${festivales[mes].emoji} ${festivales[mes].evento}</div>`;
            html += festivales.map((f, i) =>
                `<div class="item-calendario ${i===mes?'destacado':''}">
                        <span class="mes-cal">${f.mes}</span>
                        <span class="evento-cal">${f.emoji} ${f.evento}</span>
                    </div>`
            ).join('');
            c.innerHTML = html;
        }

        window.calcularPresupuesto = function() {
            const dias = parseInt(document.getElementById('diasViaje').value) || 1;
            const estilo = document.getElementById('estiloViaje').value;
            const dolar = costosDiarios[estilo];
            const total = dolar * dias;
            const cordobas = total * 36;
            const r = document.getElementById('resultadoCalc');
            r.innerHTML = `
                    <p>💵 <strong>${total}</strong> USD ≈ <strong>${cordobas.toLocaleString()}</strong> C$</p>
                    <p>📊 ${dolar} USD/día × ${dias} días</p>
                    <div class="barra-presupuesto"><div class="barra-llenado" style="width:${(dolar/120)*100}%"></div></div>
                    <small>💰 Hospedaje + comida + transporte básico</small>
                `;
        };

        // ==========================================
        // MODAL
        // ==========================================
        window.generarRuta = function() {
            const r = rutas[Math.floor(Math.random() * rutas.length)];
            document.getElementById('rutaTitulo').textContent = r.titulo;
            document.getElementById('rutaDestinos').innerHTML = r.destinos.map(d =>
                `<span class="badge">${d}</span>`
            ).join('');
            document.getElementById('rutaActividades').innerHTML = r.actividades.map(a =>
                `<li>${a}</li>`
            ).join('');
            document.getElementById('rutaTip').textContent = `💡 ${r.tip}`;
            document.getElementById('modalRuta').classList.add('mostrar');
        };

        window.cerrarModal = function() {
            document.getElementById('modalRuta').classList.remove('mostrar');
        };

        // ==========================================
        // EVENTOS
        // ==========================================
        document.addEventListener('DOMContentLoaded', function() {
            renderizarDestinos();
            renderizarFrases();
            renderizarCalendario();
            window.calcularPresupuesto();

            document.getElementById('btnRuta').addEventListener('click', window.generarRuta);
            document.getElementById('cerrarModalBtn').addEventListener('click', window.cerrarModal);
            document.getElementById('modalRuta').addEventListener('click', function(e) {
                if (e.target === this) window.cerrarModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') window.cerrarModal();
            });
            document.getElementById('diasViaje').addEventListener('input', window.calcularPresupuesto);
            document.getElementById('estiloViaje').addEventListener('change', window.calcularPresupuesto);
        });
    </script>

</body>
</html>
